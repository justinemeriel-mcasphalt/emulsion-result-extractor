<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lab Result Extractor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Lab Result Extractor</h1>

    <input
        type="file"
        id="pdfUpload"
        accept=".pdf"
        multiple>

    <button id="extractBtn">
        Extract Results
    </button>

    <button id="copyBtn">
        Copy Table
    </button>

    <p id="status">
        Upload one or more PDFs.
    </p>

    <table id="resultsTable">

        <thead>
            <tr>
                <th>Filename</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody></tbody>

    </table>

    <script src="app.js"></script>

</body>
</html>
