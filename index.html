<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lab Result Extractor</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Lab Result Extractor</h1>

<input
    type="file"
    id="pdfUpload"
    accept=".pdf"
    multiple>

<button id="extractBtn">
    Build Results Table
</button>

<button id="copyBtn">
    Copy To Clipboard
</button>

<p id="status">
    Upload PDFs to begin
</p>

<table id="resultsTable">

<thead>
<tr>
    <th>Sample</th>
    <th>Salbolt</th>
    <th>Sieve</th>
    <th>Residue</th>
    <th>Water</th>
    <th>Penetration</th>
</tr>
</thead>

<tbody></tbody>

</table>

<script src="app.js"></script>

</body>
</html>
