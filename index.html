<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <title>Lab Result Extractor</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <h1>PSV Result Extractor</h1>

    <input
        type="file"
        id="pdfUpload"
        accept=".pdf"
        multiple>

    <button id="extractBtn">
        Extract Results
    </button>

    <button id="copyBtn">
        Copy to Clipboard
    </button>

    <p id="status">
        Upload PSV reports...
    </p>

    <h2>PDF Preview</h2>
    
    <canvas id="previewCanvas"></canvas>

    <h2>OCR Output</h2>
    
    <textarea
        id="ocrText"
        rows="20"
        cols="120">
    </textarea>

    <table id="resultsTable">

        <thead>

            <tr>
                <th>Sample</th>
                <th>Salbolt</th>
                <th>Sieve</th>
                <th>Residue</th>
            </tr>

        </thead>

        <tbody></tbody>

    </table>

    <script src="app.js"></script>

</body>
</html>
